<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../img/the-evolution-of-gaming-identity-free-png.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <title>Ticket – ArgenGaming</title>
</head>
<body>

  <header>
    <div class="logo-area">
      <img src="../img/the-evolution-of-gaming-identity-free-png.png" alt="ArgenGaming Logo" width="50">
      <h1>ArgenGaming</h1>
    </div>
    <nav>
      <button id="btn-tema" class="btn-tema" onclick="toggleTema()">Claro</button>
    </nav>
  </header>

  <main class="main-ticket">

    
    <div id="ticket-pdf" class="ticket">
      <div class="ticket-header">
        <img src="../img/the-evolution-of-gaming-identity-free-png.png" alt="Logo" width="60">
        <h2>ArgenGaming</h2>
        <p class="ticket-sub">Comprobante de compra</p>
      </div>

      <div class="ticket-info">
        <p><span>Cliente:</span> <strong id="ticket-nombre"></strong></p>
        <p><span>Fecha:</span> <strong id="ticket-fecha"></strong></p>
      </div>

      <table class="tabla-ticket">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cant.</th>
            <th>Precio unit.</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="tbody-ticket"></tbody>
      </table>

      <div class="ticket-total">
        <span>Total</span>
        <strong id="ticket-total"></strong>
      </div>

      <p class="ticket-gracias">¡Gracias por tu compra!</p>
    </div>

    
    <div class="ticket-botones">
      <button class="btn-pdf" onclick="descargarPDF()">Descargar PDF</button>
      <button class="btn-salir" onclick="salir()">Salir</button>
    </div>

  </main>

  <footer class="footer">
    <p class="footer-nombres">Bautista Di Meo &mdash; Manuel Hulej &mdash; Agustina Dominguez</p>
    <p class="footer-copy">ArgenGaming &copy; 2026 &mdash; Programación III &mdash; UTN Avellaneda</p>
  </footer>

  <script src="js/datos.js"></script>
  <script>
    function renderTicket() {
      aplicarTema();

      const carrito = obtenerCarrito();
      const nombre = localStorage.getItem("nombreUsuario") || "Cliente";
      const fecha = new Date().toLocaleDateString("es-AR", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });

      document.getElementById("ticket-nombre").textContent = nombre;
      document.getElementById("ticket-fecha").textContent = fecha;

      const tbody = document.getElementById("tbody-ticket");
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.nombre}</td>
          <td>${item.cantidad}</td>
          <td>$${item.precio.toLocaleString("es-AR")}</td>
          <td>$${subtotal.toLocaleString("es-AR")}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("ticket-total").textContent = "$" + total.toLocaleString("es-AR");

      const btn = document.getElementById("btn-tema");
      const tema = localStorage.getItem("tema") || "oscuro";
      btn.textContent = tema === "claro" ? "Oscuro" : "Claro";
    }

    function descargarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a5" });

      const carrito = obtenerCarrito();
      const nombre = localStorage.getItem("nombreUsuario") || "Cliente";
      const fecha = new Date().toLocaleDateString("es-AR", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });

      // A5 = 148mm de ancho. Margen lateral: 14mm.
      // Columnas (borde derecho de cada una, para text right-align):
      const margenIzq = 14;
      const margenDer = 134;   // 148 - 14
      const colCant     = 88;  // cantidad
      const colPrecio   = 112; // precio unitario
      const colSubtotal = 134; // subtotal

      let y = 20;

      // ── Encabezado ──
      doc.setFont("helvetica", "bold");
      doc.setFontSize(20);
      doc.text("ArgenGaming", 74, y, { align: "center" });

      y += 7;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(130);
      doc.text("COMPROBANTE DE COMPRA", 74, y, { align: "center" });

      y += 5;
      doc.setDrawColor(200);
      doc.setLineWidth(0.3);
      doc.line(margenIzq, y, margenDer, y);

      // ── Datos del cliente ──
      y += 7;
      doc.setTextColor(0);
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text("Cliente:", margenIzq, y);
      doc.setFont("helvetica", "normal");
      doc.text(nombre, margenIzq + 22, y);

      y += 6;
      doc.setFont("helvetica", "bold");
      doc.text("Fecha:", margenIzq, y);
      doc.setFont("helvetica", "normal");
      doc.text(fecha, margenIzq + 22, y);

      y += 5;
      doc.line(margenIzq, y, margenDer, y);

      // ── Encabezados de tabla ──
      y += 7;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8);
      doc.setTextColor(110);
      doc.text("PRODUCTO",              margenIzq, y);
      doc.text("CANT.",   colCant,     y, { align: "right" });
      doc.text("P. UNIT.", colPrecio,  y, { align: "right" });
      doc.text("SUBTOTAL", colSubtotal, y, { align: "right" });

      y += 2;
      doc.setDrawColor(180);
      doc.line(margenIzq, y, margenDer, y);

      // ── Filas de productos ──
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(0);
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        y += 7;

        const nombreCorto = item.nombre.length > 28
          ? item.nombre.substring(0, 26) + "..."
          : item.nombre;

        doc.text(nombreCorto,                                  margenIzq, y);
        doc.text(String(item.cantidad),                        colCant,     y, { align: "right" });
        doc.text("$" + item.precio.toLocaleString("es-AR"),    colPrecio,   y, { align: "right" });
        doc.text("$" + subtotal.toLocaleString("es-AR"),       colSubtotal, y, { align: "right" });

        // Línea punteada entre filas
        doc.setDrawColor(220);
        doc.setLineDashPattern([1, 2], 0);
        doc.line(margenIzq, y + 2.5, margenDer, y + 2.5);
        doc.setLineDashPattern([], 0);
        doc.setDrawColor(0);
      });

      // ── Total ──
      y += 9;
      doc.setDrawColor(0);
      doc.setLineWidth(0.5);
      doc.line(margenIzq, y, margenDer, y);

      y += 7;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text("TOTAL", margenIzq, y);
      doc.text("$" + total.toLocaleString("es-AR"), colSubtotal, y, { align: "right" });

      // ── Pie ──
      y += 14;
      doc.setFont("helvetica", "italic");
      doc.setFontSize(8);
      doc.setTextColor(150);
      doc.text("Gracias por tu compra en ArgenGaming.", 74, y, { align: "center" });

      doc.save("ticket-" + nombre + ".pdf");
    }

    function salir() {
      guardarCarrito([]);
      localStorage.removeItem("nombreUsuario");
      window.location.href = "index.html";
    }

    // Guarda la venta en la base de datos al cargar el ticket
    async function registrarVenta() {
      const carrito = obtenerCarrito();
      const nombre = localStorage.getItem("nombreUsuario") || "Cliente";

      try {
        await fetch("http://localhost:3000/api/ventas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nombreCliente: nombre, carrito })
        });
      } catch (error) {
        console.error("No se pudo registrar la venta:", error);
      }
    }

    renderTicket();
    registrarVenta();
  </script>
</body>
</html>
