<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../img/the-evolution-of-gaming-identity-free-png.png">
  <title>ArgenGaming – Bienvenido</title>
</head>
<body>

  <header>
    <div class="logo-area">
      <img src="../img/the-evolution-of-gaming-identity-free-png.png" alt="ArgenGaming Logo" width="50">
      <h1>ArgenGaming</h1>
    </div>
    <nav>
      <button id="btn-tema" class="btn-tema" onclick="toggleTema()">Claro</button>
      <a href="http://localhost:3000/admin/login" class="btn-admin">Panel Admin</a>
    </nav>
  </header>

  <main>
    <div class="bienvenida-container">

      <div class="bienvenida-hero">
        <img src="../img/the-evolution-of-gaming-identity-free-png.png" alt="Logo ArgenGaming" class="bienvenida-logo">
        <h2>Bienvenido a <span>ArgenGaming</span></h2>
        <p>Juegos y accesorios gamer al mejor precio de Argentina.</p>
      </div>

      <div class="bienvenida-form">
        <label for="input-nombre">¿Cómo te llamás?</label>
        <input
          type="text"
          id="input-nombre"
          placeholder="Ingresá tu nombre"
          maxlength="40"
          autocomplete="off"
        >
        <!-- Mensaje de error, oculto por defecto -->
        <span class="error-msg" id="error-nombre">Por favor ingresá tu nombre para continuar.</span>
        <button class="btn-continuar" onclick="continuar()">Continuar</button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <p class="footer-nombres">Bautista Di Meo &mdash; Manuel Hulej &mdash; Agustina Dominguez</p>
    <p class="footer-copy">ArgenGaming &copy; 2026 &mdash; Programación III &mdash; UTN Avellaneda</p>
  </footer>

  <script src="js/datos.js"></script>
  <script>
    // Aplicar tema guardado al cargar
    aplicarTema();
    actualizarBotonTema();

    // Permitir continuar también con Enter
    document.getElementById("input-nombre").addEventListener("keydown", function(e) {
      if (e.key === "Enter") continuar();
    });

    // Limpiar error al escribir
    document.getElementById("input-nombre").addEventListener("input", function() {
      document.getElementById("error-nombre").style.display = "none";
    });

    function continuar() {
      const input = document.getElementById("input-nombre");
      const nombre = input.value.trim();

      if (nombre === "") {
        document.getElementById("error-nombre").style.display = "block";
        input.focus();
        return;
      }

      // Guardar nombre y limpiar carrito previo antes de empezar
      localStorage.setItem("nombreUsuario", nombre);
      guardarCarrito([]);

      window.location.href = "juegos.html";
    }

    function actualizarBotonTema() {
      const tema = localStorage.getItem("tema") || "oscuro";
      const btn = document.getElementById("btn-tema");
      if (btn) btn.textContent = tema === "claro" ? "Oscuro" : "Claro";
    }
  </script>

</body>
</html>
